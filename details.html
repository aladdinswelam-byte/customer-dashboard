<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Customer Order History</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ----------  RESET / BASE  ---------- */
    :root {
      --primary: #00a79d;
      --primary-dark: #008c83;
      --primary-light: #00b8ad;
      --surface: #ffffff;
      --background: #f8fffe;
      --text-primary: #1a3a3a;
      --text-secondary: #5a7a7a;
      --text-muted: #8a9e9e;
      --border: #e0f0ee;
      --border-light: #f0f8f7;
      --shadow: 0 1px 3px 0 rgba(0, 167, 157, 0.1), 0 1px 2px 0 rgba(0, 167, 157, 0.06);
      --shadow-md: 0 4px 6px -1px rgba(0, 167, 157, 0.1), 0 2px 4px -1px rgba(0, 167, 157, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 167, 157, 0.1), 0 4px 6px -2px rgba(0, 167, 157, 0.05);
      --radius: 12px;
      --radius-sm: 8px;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      
      /* Tier Colors */
      --vip-color: #FFD700;
      --gold-color: #FFD700;
      --silver-color: #C0C0C0;
      --bronze-color: #CD7F32;
      --new-color: #6B7280;
    }

    * { 
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 2rem;
      background: linear-gradient(135deg, #f0fffd 0%, #f8fffe 100%);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .back-btn {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: var(--transition);
    }

    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }

    /* Customer Info */
    .customer-info {
      background: var(--surface);
      padding: 1.5rem 2rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
      border-left: 4px solid var(--primary);
    }

    .customer-info h2 {
      color: var(--primary);
      margin-bottom: 0.5rem;
    }

    .customer-info p {
      color: var(--text-secondary);
      margin: 0.25rem 0;
    }

    /* Customer Analysis Banner */
    .customer-analysis {
      background: linear-gradient(135deg, var(--new-color)33 0%, var(--new-color)66 100%);
      color: white;
      padding: 20px;
      border-radius: var(--radius);
      margin-bottom: 2rem;
      box-shadow: var(--shadow-lg);
      border: 2px solid var(--new-color);
    }

    .analysis-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .analysis-text h3 {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 600;
    }

    .analysis-text p {
      margin: 5px 0 0 0;
      opacity: 0.9;
      font-size: 0.95rem;
    }

    .tier-badge {
      background: rgba(255,255,255,0.2);
      padding: 10px 20px;
      border-radius: 25px;
      font-weight: 700;
      font-size: 1rem;
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255,255,255,0.3);
      text-align: center;
      min-width: 120px;
    }

    /* VIP Tier */
    .tier-vip {
      background: linear-gradient(135deg, var(--vip-color)33 0%, var(--vip-color)66 100%) !important;
      border-color: var(--vip-color) !important;
    }
    .badge-vip {
      background: #B8860B !important;
    }

    /* Gold Tier */
    .tier-gold {
      background: linear-gradient(135deg, var(--gold-color)33 0%, var(--gold-color)66 100%) !important;
      border-color: var(--gold-color) !important;
    }
    .badge-gold {
      background: #B8860B !important;
    }

    /* Silver Tier */
    .tier-silver {
      background: linear-gradient(135deg, var(--silver-color)33 0%, var(--silver-color)66 100%) !important;
      border-color: var(--silver-color) !important;
    }
    .badge-silver {
      background: #808080 !important;
    }

    /* Bronze Tier */
    .tier-bronze {
      background: linear-gradient(135deg, var(--bronze-color)33 0%, var(--bronze-color)66 100%) !important;
      border-color: var(--bronze-color) !important;
    }
    .badge-bronze {
      background: #8B4513 !important;
    }

    /* New Tier */
    .tier-new {
      background: linear-gradient(135deg, var(--new-color)33 0%, var(--new-color)66 100%) !important;
      border-color: var(--new-color) !important;
    }
    .badge-new {
      background: #4B5563 !important;
    }

    /* Orders Table */
    .table-container {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      margin-bottom: 2rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      font-size: 0.95rem;
    }

    thead {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    }

    th {
      padding: 1.25rem 1rem;
      text-align: left;
      color: white;
      font-weight: 600;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    tbody tr {
      transition: var(--transition);
      border-bottom: 1px solid var(--border-light);
    }

    tbody tr:hover {
      background: #f5fffe;
    }

    tbody tr:nth-child(even) {
      background: #f8fffe;
    }

    td {
      padding: 1.25rem 1rem;
      color: var(--text-primary);
      font-weight: 500;
    }

    /* Status badges */
    .status-badge {
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-completed {
      background: #d1fae5;
      color: #065f46;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 2rem;
      color: var(--text-secondary);
    }

    /* No Data */
    .no-data {
      text-align: center;
      color: var(--text-muted);
      font-style: italic;
      padding: 2rem;
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      body {
        padding: 1rem;
      }
      
      .header {
        flex-direction: column;
        gap: 1rem;
        align-items: flex-start;
      }
      
      .analysis-content {
        flex-direction: column;
        text-align: center;
      }
      
      .table-container {
        overflow-x: auto;
      }
      
      th, td {
        padding: 1rem 0.75rem;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="index.html" class="back-btn">← Back to Dashboard</a>
    <h1>Customer Order History</h1>
  </div>

  <div id="loading" class="loading">Loading order history...</div>

  <div id="content" style="display: none;">
    <!-- Customer Information -->
    <div class="customer-info">
      <h2 id="customerName">Loading...</h2>
      <p id="customerPhone">Phone: Loading...</p>
      <p id="orderStats">Total Orders: Loading... | Total Spent: Loading...</p>
    </div>

    <!-- Customer Analysis Banner -->
    <div id="customerAnalysis" class="customer-analysis tier-new" style="display: none;">
      <div class="analysis-content">
        <div class="analysis-text">
          <h3 id="analysisMessage">Loading analysis...</h3>
          <p id="analysisDetails">Calculating customer insights...</p>
        </div>
        <div id="tierBadge" class="tier-badge badge-new">Loading...</div>
      </div>
    </div>

    <!-- Orders Table -->
    <div class="table-container">
      <table id="ordersTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Restaurant</th>
            <th>Amount</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td colspan="4" class="loading">Loading orders...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Get phone number from URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const phone = urlParams.get('phone');

    // Customer Tier Analysis System
    function calculateCustomerTier(customerOrders) {
      if (!customerOrders || customerOrders.length === 0) {
        return { 
          tier: "New", 
          color: "var(--new-color)",
          badgeColor: "var(--new-color)",
          message: "New customer - No orders yet" 
        };
      }

      const totalOrders = customerOrders.length;
      const totalSpent = customerOrders.reduce((sum, order) => sum + (parseFloat(order['Total Price']) || 0), 0);
      const avgOrderValue = totalSpent / totalOrders;
      
      // Calculate orders per week
      let ordersPerWeek = 0;
      if (customerOrders.length > 1) {
        const sortedOrders = customerOrders.sort((a, b) => new Date(a['Created'] || '') - new Date(b['Created'] || ''));
        const firstOrder = new Date(sortedOrders[0]['Created'] || '');
        const lastOrder = new Date(sortedOrders[sortedOrders.length - 1]['Created'] || '');
        const weeksActive = Math.max(1, (lastOrder - firstOrder) / (7 * 24 * 60 * 60 * 1000));
        ordersPerWeek = totalOrders / weeksActive;
      }

      // Tier scoring system - Adjust these numbers for your business
      let score = 0;
      
      // Order frequency points
      if (ordersPerWeek >= 3) score += 3;
      else if (ordersPerWeek >= 2) score += 2;
      else if (ordersPerWeek >= 1) score += 1;
      
      // Total orders points
      if (totalOrders >= 20) score += 3;
      else if (totalOrders >= 10) score += 2;
      else if (totalOrders >= 5) score += 1;
      
      // Average order value points (adjust EGP thresholds for your business)
      if (avgOrderValue >= 50) score += 3;
      else if (avgOrderValue >= 30) score += 2;
      else if (avgOrderValue >= 15) score += 1;

      // Determine tier
      if (score >= 8) return { 
        tier: "VIP", 
        color: "var(--vip-color)",
        badgeColor: "var(--vip-color)",
        score 
      };
      if (score >= 6) return { 
        tier: "Gold", 
        color: "var(--gold-color)",
        badgeColor: "var(--gold-color)", 
        score 
      };
      if (score >= 4) return { 
        tier: "Silver", 
        color: "var(--silver-color)",
        badgeColor: "var(--silver-color)",
        score 
      };
      if (score >= 2) return { 
        tier: "Bronze", 
        color: "var(--bronze-color)",
        badgeColor: "var(--bronze-color)",
        score 
      };
      return { 
        tier: "New", 
        color: "var(--new-color)",
        badgeColor: "var(--new-color)",
        score 
      };
    }

    function displayCustomerAnalysis(customerName, customerOrders) {
      const tierInfo = calculateCustomerTier(customerOrders);
      const totalOrders = customerOrders.length;
      const totalSpent = customerOrders.reduce((sum, order) => sum + (parseFloat(order['Total Price']) || 0), 0);
      const avgOrderValue = totalSpent / totalOrders;
      
      // Calculate orders per week for display
      let ordersPerWeek = 0;
      let weeksActive = 1;
      if (customerOrders.length > 1) {
        const sortedOrders = customerOrders.sort((a, b) => new Date(a['Created'] || '') - new Date(b['Created'] || ''));
        const firstOrder = new Date(sortedOrders[0]['Created'] || '');
        const lastOrder = new Date(sortedOrders[sortedOrders.length - 1]['Created'] || '');
        weeksActive = Math.max(1, (lastOrder - firstOrder) / (7 * 24 * 60 * 60 * 1000));
        ordersPerWeek = totalOrders / weeksActive;
      }

      // Create messages
      const mainMessage = `${customerName} is a ${tierInfo.tier} customer`;
      const detailsMessage = `${totalOrders} orders • EGP ${avgOrderValue.toFixed(2)} avg • ${ordersPerWeek.toFixed(1)} orders/week`;

      // Update the display
      document.getElementById('analysisMessage').textContent = mainMessage;
      document.getElementById('analysisDetails').textContent = detailsMessage;
      document.getElementById('tierBadge').textContent = `${tierInfo.tier} Tier`;
      
      // Apply tier-specific styling
      const analysisDiv = document.getElementById('customerAnalysis');
      const badgeDiv = document.getElementById('tierBadge');
      
      // Remove all tier classes
      analysisDiv.className = 'customer-analysis';
      badgeDiv.className = 'tier-badge';
      
      // Add current tier classes
      analysisDiv.classList.add(`tier-${tierInfo.tier.toLowerCase()}`);
      badgeDiv.classList.add(`badge-${tierInfo.tier.toLowerCase()}`);
      
      document.getElementById('customerAnalysis').style.display = 'block';
    }

    async function loadOrderHistory() {
      if (!phone) {
        document.getElementById('loading').innerHTML = 'No customer phone specified';
        return;
      }

      try {
        // Load data
        const dataRows = await fetch('data.json').then(r => r.json());
        
        // Filter ALL orders for this customer
        const customerOrders = dataRows.filter(order => 
          (order['Account Phones'] || '').toString().trim() === phone
        );

        // Show content
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';

        // Update customer info
        const customerName = customerOrders[0]?.['Account Name'] || 'Unknown Customer';
        const totalOrders = customerOrders.length;
        const totalSpent = customerOrders.reduce((sum, order) => sum + (parseFloat(order['Total Price']) || 0), 0);
        
        document.getElementById('customerName').textContent = customerName;
        document.getElementById('customerPhone').textContent = `Phone: ${phone}`;
        document.getElementById('orderStats').textContent = `Total Orders: ${totalOrders} | Total Spent: EGP ${totalSpent.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;

        // Display customer analysis
        displayCustomerAnalysis(customerName, customerOrders);

        // Update orders table - Show ALL orders
        const tbody = document.querySelector('#ordersTable tbody');
        if (customerOrders.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4"><div class="no-data">No orders found for this customer</div></td></tr>';
        } else {
          tbody.innerHTML = customerOrders
            .sort((a, b) => new Date(b['Created'] || '') - new Date(a['Created'] || ''))
            .map(order => `
              <tr>
                <td>${new Date(order['Created'] || '').toLocaleDateString()}</td>
                <td>${order['Resturant'] || order['Restaurant'] || 'N/A'}</td>
                <td>EGP ${(parseFloat(order['Total Price']) || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                <td><span class="status-badge status-completed">Completed</span></td>
              </tr>
            `).join('');
        }

      } catch (error) {
        console.error('Error loading order history:', error);
        document.getElementById('loading').innerHTML = 'Error loading order history';
      }
    }

    // Load order history when page loads
    loadOrderHistory();
  </script>
</body>
</html>
