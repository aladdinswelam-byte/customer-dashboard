<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Complaint Details</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #00a79d;
      --primary-dark: #008c83;
      --primary-light: #00b8ad;
      --surface: #ffffff;
      --background: #f8fffe;
      --text-primary: #1a3a3a;
      --text-secondary: #5a7a7a;
      --text-muted: #8a9e9e;
      --border: #e0f0ee;
      --border-light: #f0f8f7;
      --shadow: 0 1px 3px 0 rgba(0, 167, 157, 0.1), 0 1px 2px 0 rgba(0, 167, 157, 0.06);
      --shadow-md: 0 4px 6px -1px rgba(0, 167, 157, 0.1), 0 2px 4px -1px rgba(0, 167, 157, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 167, 157, 0.1), 0 4px 6px -2px rgba(0, 167, 157, 0.05);
      --radius: 12px;
      --radius-sm: 8px;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 2rem;
      background: linear-gradient(135deg, #f0fffd 0%, #f8fffe 100%);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    .back-btn {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: var(--transition);
    }
    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }
    h1 {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }
    .customer-info {
      background: var(--surface);
      padding: 1.5rem 2rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 2rem;
      border-left: 4px solid var(--primary);
    }
    .customer-info h2 { color: var(--primary); margin-bottom: 0.5rem; }
    .customer-info p { color: var(--text-secondary); margin: 0.25rem 0; }
    .section-header {
      color: var(--primary);
      margin: 2rem 0 1rem 0;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--primary);
      font-size: 1.5rem;
      font-weight: 700;
    }
    .table-container {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      margin-bottom: 2rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      font-size: 0.95rem;
    }
    thead {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    }
    th {
      padding: 1.25rem 1rem;
      text-align: left;
      color: white;
      font-weight: 600;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    tbody tr {
      transition: var(--transition);
      border-bottom: 1px solid var(--border-light);
    }
    tbody tr:hover { background: #f5fffe; }
    tbody tr:nth-child(even) { background: #f8fffe; }
    td { padding: 1.25rem 1rem; color: var(--text-primary); font-weight: 500; }
    .status-badge {
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .status-resolved { background: #d1fae5; color: #065f46; }
    .status-pending { background: #fef3c7; color: #92400e; }
    .status-open { background: #fee2e2; color: #991b1b; }
    .resolution-details {
      background: #f8fffe;
      padding: 1.5rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      margin-top: 1rem;
    }
    .resolution-text {
      line-height: 1.6;
      white-space: pre-wrap;
      direction: rtl;
      text-align: right;
      font-family: 'Inter', sans-serif;
    }
    .no-data {
      text-align: center;
      color: var(--text-muted);
      font-style: italic;
      padding: 2rem;
      background: #f8fffe;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }
    .loading {
      text-align: center;
      padding: 2rem;
      color: var(--text-secondary);
    }
    @media (max-width: 768px) {
      body { padding: 1rem; }
      .header { flex-direction: column; gap: 1rem; align-items: flex-start; }
      .table-container { overflow-x: auto; }
      th, td { padding: 1rem 0.75rem; font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="index.html" class="back-btn">← Back to Dashboard</a>
    <h1>Complaint Details</h1>
  </div>

  <div id="loading" class="loading">Loading complaint details...</div>

  <div id="content" style="display: none;">
    <div class="customer-info">
      <h2 id="customerName">Loading...</h2>
      <p id="customerPhone">Phone: Loading...</p>
    </div>

    <!-- COMPLAINTS -->
    <h2 class="section-header">Complaints</h2>
    <div class="table-container">
      <table id="complaintTable">
        <thead>
          <tr>
            <th>Complaint Date</th>
            <th>Details</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="3" class="loading">Loading complaints...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- RESOLUTIONS -->
    <h2 class="section-header">Resolutions</h2>
    <div class="table-container">
      <table id="resolutionTable">
        <thead>
          <tr>
            <th>Resolution Date</th>
            <th>Restaurant</th>
            <th>Resolved By</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="4" class="loading">Loading resolutions...</td></tr>
        </tbody>
      </table>
      <div id="resolutionDetails" class="resolution-details">
        <strong>Resolution Details:</strong>
        <div id="resolutionText" class="resolution-text">Loading resolution details...</div>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const phone = urlParams.get('phone');

    async function loadComplaintDetails() {
      if (!phone) {
        document.getElementById('loading').innerHTML = 'No customer phone specified';
        return;
      }

      try {
        const [compRows, resolutions] = await Promise.all([
          fetch('complaints.json').then(r => r.json()),
          fetch('resolutions.json').then(r => r.json())
        ]);

        const customerComplaints = compRows.filter(c =>
          (c.phone || '').toString().trim() === phone
        );
        const customerResolutions = resolutions.filter(r =>
          (r.phone || '').toString().trim() === phone
        );

        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';

        const customerName = customerComplaints[0]?.name || 'Unknown Customer';
        document.getElementById('customerName').textContent = customerName;
        document.getElementById('customerPhone').textContent = `Phone: ${phone}`;

        /* ---- COMPLAINTS TABLE ---- */
        const complaintTbody = document.querySelector('#complaintTable tbody');
        if (customerComplaints.length) {
          complaintTbody.innerHTML = customerComplaints.map(c => `
            <tr>
              <td>${c.date || 'N/A'}</td>
              <td>${c.details || 'No details provided'}</td>
              <td><span class="status-badge ${
                c.status === 'Resolved' ? 'status-resolved' :
                c.status === 'Pending'  ? 'status-pending'  : 'status-open'}">${c.status || 'Open'}</span></td>
            </tr>`).join('');
        } else {
          complaintTbody.innerHTML = '<tr><td colspan="3"><div class="no-data">No complaints found</div></td></tr>';
        }

        /* ---- RESOLUTIONS TABLE ---- */
        const resolutionTbody = document.querySelector('#resolutionTable tbody');
        const resolutionText = document.getElementById('resolutionText');
        if (customerResolutions.length) {
          resolutionTbody.innerHTML = customerResolutions.map(r => `
            <tr>
              <td>${r.date || 'N/A'}</td>
              <td>${r.Resturant || 'N/A'}</td>
              <td>${r.Resolvedby || 'Call Center Agent'}</td>
              <td><span class="status-badge status-resolved">${r.Status || 'Resolved'}</span></td>
            </tr>`).join('');
          resolutionText.textContent = customerResolutions.map(r => r.Resolution || '').join('\n\n---\n\n');
        } else {
          resolutionTbody.innerHTML = '<tr><td colspan="4"><div class="no-data">No resolution found</div></td></tr>';
          resolutionText.textContent = 'No resolution details available.';
        }
      } catch (error) {
        console.error('Error loading complaint details:', error);
        document.getElementById('loading').innerHTML = 'Error loading complaint details';
      }
    }

    loadComplaintDetails();
  </script>
</body>
</html>
