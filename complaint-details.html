<script>
/* ----------  COMPLAINT-DETAILS LOGIC  ---------- */
(async () => {
  const urlParams = new URLSearchParams(window.location.search);
  const phone     = urlParams.get('phone');

  if (!phone) {
    document.getElementById('loading').textContent = 'No customer phone specified';
    return;
  }

  try {
    const [orders, complaints, resolutions] = await Promise.all([
      fetch('data.json').then(r => r.json()),
      fetch('complaints.json').then(r => r.json()),
      fetch('resolutions.json').then(r => r.json())
    ]);

    /* ----------  filter customer data  ---------- */
    const custOrders      = orders.filter(o => String(o['Account Phones']||'').trim() === phone);
    const custComplaints  = complaints.filter(c => String(c.phone||'').trim() === phone);
    const custResolutions = resolutions.filter(r => String(r.phone||'').trim() === phone);

    /* ----------  show page  ---------- */
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';

    /* ----------  customer header  ---------- */
    const name = custOrders[0]?.['Account Name'] || custComplaints[0]?.name || 'Unknown Customer';
    document.getElementById('customerName').textContent   = name;
    document.getElementById('customerPhone').textContent  = `Phone: ${phone}`;

    /* ----------  TABLE 1 – most-recent order  ---------- */
    const orderBody = document.querySelector('#orderTable tbody');
    if (custOrders.length) {
      const recent = custOrders.sort((a,b) => new Date(b['Created']||0) - new Date(a['Created']||0))[0];
      orderBody.innerHTML = `
        <tr>
          <td>${new Date(recent['Created']||'').toLocaleDateString()}</td>
          <td>${recent['Resturant']||recent['Restaurant']||'N/A'}</td>
          <td>EGP ${(parseFloat(recent['Total Price'])||0).toLocaleString('en-US',{minimumFractionDigits:2})}</td>
          <td><span class="status-badge status-completed">Completed</span></td>
        </tr>`;
    } else {
      orderBody.innerHTML = '<tr><td colspan="4"><div class="no-data">No orders found</div></td></tr>';
    }

    /* ----------  TABLE 2 – all complaints  ---------- */
    const compBody = document.querySelector('#complaintTable tbody');
    compBody.innerHTML = custComplaints.length
      ? custComplaints.map(c => `
          <tr>
            <td>${c.date||'N/A'}</td>
            <td>${c.details||'No details provided'}</td>
            <td><span class="status-badge ${badgeClass(c.status)}">${c.status||'Open'}</span></td>
          </tr>`).join('')
      : '<tr><td colspan="3"><div class="no-data">No complaints found</div></td></tr>';

    /* ----------  TABLE 3 – all resolutions  ---------- */
    const resBody = document.querySelector('#resolutionTable tbody');
    const resText   = document.getElementById('resolutionText');

    if (custResolutions.length) {
      resBody.innerHTML = custResolutions.map(r => `
        <tr>
          <td>${r.date||'N/A'}</td>
          <td>${r.Resturant||'N/A'}</td>
          <td>${r.Resolvedby||'Call Center Agent'}</td>
          <td><span class="status-badge status-resolved">${r.Status||'Resolved'}</span></td>
        </tr>`).join('');

      resText.innerHTML = custResolutions.map(r =>
        `<strong>${r.date||'N/A'}:</strong><br/>${r.Resolution||'No resolution details provided.'}<br/><br/>`
      ).join('');
    } else {
      resBody.innerHTML = '<tr><td colspan="4"><div class="no-data">No resolution found</div></td></tr>';
      resText.textContent = 'No resolution details available.';
    }

  } catch (err) {
    console.error(err);
    document.getElementById('loading').textContent = 'Error loading complaint details';
  }

  /* ----------  helper  ---------- */
  function badgeClass(status) {
    if (status === 'Resolved') return 'status-resolved';
    if (status === 'Pending') return 'status-pending';
    return 'status-open';
  }
})();
</script>
